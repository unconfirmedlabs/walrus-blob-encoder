[package]
name = "walrus-stock-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
walrus-core = { git = "https://github.com/MystenLabs/walrus.git", rev = "d6c6d3c59ab0cd9e5abd7be96c7133d056de4c84", package = "walrus-core" }

getrandom = { version = "0.2", features = ["custom"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[workspace]
