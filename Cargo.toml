[package]
name = "walrus-blob-encoder"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Fast, byte-exact Walrus blob ID and blob metadata computation"
repository = "https://github.com/unconfirmedlabs/walrus-blob-encoder"
readme = "README.md"
keywords = ["walrus", "blob-id", "reed-solomon", "blake2b", "simd"]
categories = ["cryptography", "encoding"]
publish = false

[dependencies]
rayon = "1.11"
reed-solomon-simd = "=3.1.0"

[dev-dependencies]
blake2 = "0.10.6"
walrus-core = { git = "https://github.com/MystenLabs/walrus.git", rev = "c377852712d30a23031c04d07dc13bf5e20a92de", package = "walrus-core" }

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
codegen-units = 1
lto = "fat"

[profile.bench]
debug = 1
