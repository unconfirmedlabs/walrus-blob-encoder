[workspace]
resolver = "2"
members = [
    "crates/reed-solomon-simd",
    "crates/walrus-blob-encoder",
    "crates/walrus-blob-encoder-cli",
    "crates/walrus-blob-encoder-wasm",
]

[profile.release]
codegen-units = 1
lto = "fat"

[profile.bench]
debug = 1

# The WebAssembly build: release plus `panic = "abort"`, which a profile cannot set per package.
[profile.wasm]
inherits = "release"
panic = "abort"
