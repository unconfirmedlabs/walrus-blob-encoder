[package]
name = "reed-solomon-simd"
version = "3.1.0"
license = "MIT AND BSD-3-Clause"
description = "Reed-Solomon coding with O(n log n) complexity. Leverages SIMD instructions on x86(-64), AArch64 and WebAssembly."
repository = "https://github.com/AndersTrier/reed-solomon-simd"
keywords = ["erasure", "reed-solomon", "Leopard-RS"]
categories = ["algorithms", "encoding"]
edition = "2021"
rust-version = "1.82"

include = [
    "/benches",
    "/src",
    "LICENSE",
    "README.md",
    "build.rs",
]

[dependencies]
fixedbitset = { version = "0.5.7", default-features = false }
wide = { version = "1.7.1", default-features = false }
once_cell = { version = "1.21.3", default-features = false, features = ["alloc", "race"] }

[build-dependencies]
readme-rustdocifier = "0.1.1"

[dev-dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }
hex = "0.4.3"
rand = "0.9.2"
rand_chacha = "0.9.0"
sha2 = "0.10.9"

[features]
default = ["std"]
std = ["fixedbitset/std"]

[lib]
bench = false

[[bench]]
name = "benchmarks"
harness = false
